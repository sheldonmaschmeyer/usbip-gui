[workspace]
name = "usbip-gui"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64"]
version = "1.4.0"

[dependencies]
python = ">=3.14.7,<3.15"
babel = ">=2.18.0,<3"
openssl = ">=3.6.4,<4"
pyusb = ">=1.3.1,<2"
cryptography = ">=50.0.1,<51"

[pypi-dependencies]
PyQt6 = ">=6.7.1, <7"

[feature.dev.dependencies]
flake8 = ">=7.3.0,<8"
flake8-pyproject = ">=1.2.4,<2"
black = ">=26.5.1,<27"
pylint = ">=4.0.8,<5"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
pyright = ">=1.1.414,<2"
mypy = ">=2.3.1,<3"

[environments]
default = ["dev"]
[tasks]
usbip = "python -m usbip_gui"
lint = "python -m flake8 . && python -m pylint . && python -m pyright . && python -m mypy ."
format = "python -m black ."
test = { cmd = "python -m pytest tests/ -v --cov=usbip_gui --cov-report=html --cov-report=term", env = { PYTHONPATH = ".", QT_QPA_PLATFORM = "offscreen" } }
