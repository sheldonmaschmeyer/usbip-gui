[workspace]
name = "usbip-gui"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64"]
version = "1.4.0"

[dependencies]
python = ">=3.10"
babel = ">=2.18.0,<3"
openssl = ">=3.6.3,<4"

[pypi-dependencies]
PyQt6 = "*"

[feature.dev.dependencies]
flake8 = "*"
black = "*"
pylint = "*"
pytest = "*"
pytest-cov = "*"
pyright = ">=1.1.411,<2"
mypy = "*"

[environments]
default = ["dev"]
[tasks]
usbip = "python -m usbip_gui"
lint = "python -m flake8 . && python -m pylint . && python -m pyright . && python -m mypy ."
format = "python -m black ."
test = { cmd = "PYTHONPATH=. python -m pytest tests/ -v --cov=usbip_gui --cov-report=html --cov-report=term", env = { QT_QPA_PLATFORM = "offscreen" } }
