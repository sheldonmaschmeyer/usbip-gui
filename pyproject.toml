[tool.black]
line-length = 79

[tool.pylint.main]
ignore = [".git", ".pixi"]
extension-pkg-allow-list = ["PyQt6"]

[tool.pylint.design]
max-locals = 35
max-statements = 70
max-branches = 20
max-attributes = 25
max-returns = 10
min-public-methods = 0

[tool.mypy]
check_untyped_defs = true
disallow_any_explicit = true
